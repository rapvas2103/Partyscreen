<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Polytrack - La Boîte à Jeux</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #000;
        }
        iframe {
            width: 100%;
            height: 100%;
            border: none;
        }
        .btn-home {
            position: fixed;
            top: 15px;
            left: 15px;
            z-index: 9999;
            background: rgba(0, 0, 0, 0.6);
            backdrop-filter: blur(6px);
            color: white;
            padding: 10px 18px;
            border-radius: 30px;
            text-decoration: none;
            font-weight: bold;
            font-family: sans-serif;
            border: 1px solid rgba(255, 255, 255, 0.2);
            display: flex;
            align-items: center;
            gap: 8px;
            transition: 0.2s;
            font-size: 14px;
        }
        .btn-home:hover {
            background: rgba(255, 255, 255, 0.25);
            transform: scale(1.05);
        }
    </style>
</head>
<body>

    <!-- Bouton Accueil -->
    <a href="index.html" class="btn-home">
        <i class="fa-solid fa-house"></i> Accueil
    </a>

    <!-- Le jeu en plein écran -->
    <!-- Version miroir GitHub Pages (optimisée pour tourner en iframe sans pub) -->
	<iframe src="https://htmlunblockedgames.github.io/polytrack-0.5.2-clean/" allowfullscreen></iframe>

</body>
</html>
